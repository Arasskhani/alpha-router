stages:
  - verify
  - audit

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

backend-tests:
  stage: verify
  image: python:3.12-slim
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml
  script:
    - python -m pip install --no-cache-dir -r backend/requirements.txt
    - python -m pip install --no-cache-dir pytest
    - PYTHONPATH=backend python -m pytest backend/tests -q

frontend-tests-and-build:
  stage: verify
  image: node:20
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - npm test
    - npm run build

frontend-audit:
  stage: audit
  image: node:20
  rules:
    - changes:
        - frontend/package.json
        - frontend/package-lock.json
        - .gitlab-ci.yml
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - npm audit --omit=dev

backend-audit:
  stage: audit
  image: python:3.12-slim
  allow_failure: true
  rules:
    - changes:
        - backend/requirements.txt
        - .gitlab-ci.yml
  script:
    - python -m pip install --no-cache-dir pip-audit
    - pip-audit -r backend/requirements.txt -f json -o pip-audit.json || audit_status=$?
    - test -f pip-audit.json
    - cat pip-audit.json
    - |
      if [ "${audit_status:-0}" -ne 0 ]; then
        echo "pip-audit reported vulnerabilities; review the artifact before enforcing this job."
        exit "${audit_status}"
      fi
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - pip-audit.json
