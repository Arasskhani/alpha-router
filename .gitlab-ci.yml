stages:
  - verify
  - audit
  - publish

variables:
  SEAWEEDFS_IMAGE: "chrislusf/seaweedfs:4.40"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# Every verify job runs unconditionally on the default branch. Path-scoped
# 'changes' rules alone let a backend-only merge skip the frontend jobs (and
# vice-versa), so a red job could sit on main unnoticed for weeks.
.always-on-default: &always-on-default
  if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

.backend-rules: &backend-rules
  rules:
    - *always-on-default
    - changes:
        - backend/**/*
        - .gitlab-ci.yml

.frontend-rules: &frontend-rules
  rules:
    - *always-on-default
    - changes:
        - frontend/**/*
        - scripts/check-frontend-sources.sh
        - .gitlab-ci.yml

backend-lint:
  stage: verify
  image: python:3.12-slim
  <<: *backend-rules
  script:
    - python -m pip install --no-cache-dir -r backend/requirements-dev.txt
    # Full rule set (backend/ruff.toml) plus formatting; both are hard gates.
    - cd backend && ruff check . && ruff format --check .
    # Dead code: anything vulture is >=80% sure about fails; allowlist in vulture_whitelist.py.
    - vulture app vulture_whitelist.py --min-confidence 80

# Type errors are frozen in backend/mypy-baseline.txt; the job fails on any
# error not in the baseline. Fix errors and run `scripts/mypy-check.sh --sync`
# to shrink it — never to grow it.
backend-typecheck:
  stage: verify
  image: python:3.12-slim
  <<: *backend-rules
  script:
    # Two installs: the lock is hash-verified, the dev tools are not (pip refuses to mix).
    - python -m pip install --no-cache-dir --require-hashes -r backend/requirements.lock
    - python -m pip install --no-cache-dir -r backend/requirements-dev.txt
    - bash scripts/mypy-check.sh

backend-tests:
  stage: verify
  image: python:3.12-slim
  <<: *backend-rules
  script:
    # Two installs: the lock is hash-verified, the dev tools are not (pip refuses to mix).
    - python -m pip install --no-cache-dir --require-hashes -r backend/requirements.lock
    - python -m pip install --no-cache-dir -r backend/requirements-dev.txt
    - python -m pip check
    - cd backend && python -m pytest tests -q

# The same suite, on the engine production actually runs.
#
# backend-tests above uses SQLite, where foreign keys are enforced (the shared
# fixture sets the pragma) but SELECT ... FOR UPDATE, SKIP LOCKED and row
# triggers are silently ignored. A referential action on PostgreSQL is a real
# UPDATE that fires triggers, and that difference has hidden at least one bug
# that made an endpoint fail in production while every test stayed green. So the
# suite runs twice: once fast, once truthful.
backend-tests-postgres:
  stage: verify
  image: python:3.12-slim
  <<: *backend-rules
  services:
    - name: postgres:16.13-alpine
      alias: postgres
  variables:
    POSTGRES_USER: alpha_router
    POSTGRES_PASSWORD: ci-tests
    POSTGRES_DB: alpha_router_test
    POSTGRES_HOST_AUTH_METHOD: trust
    TEST_DATABASE_URL: postgresql+asyncpg://alpha_router:ci-tests@postgres:5432/alpha_router_test
  script:
    # Two installs: the lock is hash-verified, the dev tools are not (pip refuses to mix).
    - python -m pip install --no-cache-dir --require-hashes -r backend/requirements.lock
    - python -m pip install --no-cache-dir -r backend/requirements-dev.txt
    - cd backend && python -m pytest tests -q

# The money path relies on SELECT ... FOR UPDATE / SKIP LOCKED, which SQLite
# silently ignores. Run the real migration entrypoint (the same one db-init
# executes) and the opt-in reservation canary against PostgreSQL 16.
backend-postgres-canary:
  stage: verify
  image: python:3.12-slim
  <<: *backend-rules
  services:
    - name: postgres:16.13-alpine
      alias: postgres
  variables:
    POSTGRES_USER: alpha_router
    POSTGRES_PASSWORD: ci-canary
    POSTGRES_DB: alpha_router_test
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: postgresql+asyncpg://alpha_router:ci-canary@postgres:5432/alpha_router_test
    RUN_POSTGRES_RESERVATION_CANARY: "1"
  script:
    # Two installs: the lock is hash-verified, the dev tools are not (pip refuses to mix).
    - python -m pip install --no-cache-dir --require-hashes -r backend/requirements.lock
    - python -m pip install --no-cache-dir -r backend/requirements-dev.txt
    - cd backend
    - python -m app.migrate
    - PYTHONPATH=. python -m pytest tests/test_budget_reservations_postgres.py tests/test_budget_reconcile_race_postgres.py tests/test_scheduler_leader.py tests/test_readiness.py tests/test_schema_baseline.py tests/test_money_numeric_postgres.py -q -rs

deployment-config:
  stage: verify
  image: docker:27-cli
  variables:
    COMPOSE_PROJECT_NAME: "alpha-router"
    POSTGRES_USER: "alpha_router"
    POSTGRES_DB: "alpha_router"
    POSTGRES_PASSWORD: "ci-compose-placeholder"
    S3_ACCESS_KEY: "alpha_router"
    S3_SECRET_KEY: "ci-compose-placeholder"
    S3_BUCKET: "alpha-router-media"
    SEAWEEDFS_ADMIN_PASSWORD: "ci-compose-placeholder"
    SANDBOX_BROKER_TOKEN: "ci-compose-placeholder-at-least-32-characters"
  rules:
    - changes:
        - docker-compose.yml
        - Dockerfile
        - sandbox/**/*
        - sandbox-broker/**/*
        - deploy/**/*
        - scripts/**/*
        - .env.example
        - .gitlab-ci.yml
  script:
    - cp .env.example .env
    - docker compose config --quiet
    - ALPHAROUTER_REGISTRY=registry.example.com/group/alpha-router docker compose -f docker-compose.yml -f deploy/docker-compose.registry.yml config --quiet

# Shell helpers that edit .env / rotate secrets are unit-tested with mocked
# docker/compose; a regression here takes a production host down on upgrade.
scripts-tests:
  stage: verify
  # Debian, not busybox: the scripts run on Ubuntu hosts and lean on GNU
  # sed/grep/date semantics; the harness must exercise the same tools.
  image: debian:bookworm-slim
  rules:
    - *always-on-default
    - changes:
        - scripts/**/*
        - .gitlab-ci.yml
  script:
    - apt-get update -qq >/dev/null && apt-get install -y -qq --no-install-recommends bash openssl python3 >/dev/null
    - for t in scripts/tests/test-*.sh; do echo "== $t"; bash "$t"; done

frontend-sources:
  stage: verify
  image: node:20
  <<: *frontend-rules
  script:
    - bash scripts/check-frontend-sources.sh

frontend-tests-and-build:
  stage: verify
  image: node:20
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  <<: *frontend-rules
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
  script:
    # eslint: errors fail; the warning budget (--max-warnings in package.json)
    # is the Phase 3 baseline and may only be lowered.
    - npm run lint
    # Unused exports/types/dependencies fail the build (knip.json).
    - npm run knip
    - npm test
    - npm run build

frontend-audit:
  stage: audit
  image: node:20
  rules:
    - *always-on-default
    - changes:
        - frontend/package.json
        - frontend/package-lock.json
        - .gitlab-ci.yml
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - npm audit --omit=dev --audit-level=high

backend-audit:
  stage: audit
  image: python:3.12-slim
  rules:
    - *always-on-default
    - changes:
        - backend/requirements.txt
        - backend/requirements.lock
        - sandbox/requirements.txt
        - sandbox-broker/requirements.txt
        - .gitlab-ci.yml
  script:
    - python -m pip install --no-cache-dir pip-audit
    # All three images, not only the API: the sandbox runs user-supplied code
    # against numpy/pandas/reportlab, which is the set most worth auditing.
    - pip-audit --no-deps -r backend/requirements.lock -r sandbox/requirements.txt -r sandbox-broker/requirements.txt -f json -o pip-audit.json || audit_status=$?
    - test -f pip-audit.json
    - cat pip-audit.json
    - |
      if [ "${audit_status:-0}" -ne 0 ]; then
        echo "pip-audit reported vulnerabilities; review pip-audit.json before merging."
        exit "${audit_status}"
      fi
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - pip-audit.json

# NOTICE claims that everything it does not name is permissively licensed.
# Check the claim against what is actually installed - all three Python sets
# and the frontend's production dependencies - so a copyleft or
# source-available package cannot arrive with an ordinary bump and sit
# unnoticed. Strong copyleft fails regardless of NOTICE; weak copyleft and
# unknowns fail unless NOTICE names them. See scripts/check-licences.py.
licences:
  stage: audit
  image: python:3.12-slim
  rules:
    - *always-on-default
    - changes:
        - backend/requirements.txt
        - backend/requirements.lock
        - sandbox/requirements.txt
        - sandbox-broker/requirements.txt
        - frontend/package-lock.json
        - NOTICE
        - scripts/check-licences.py
        - scripts/licence-overrides.json
        - .gitlab-ci.yml
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends nodejs npm > /dev/null
  script:
    # One environment per image, exactly as each image is built: the sandbox
    # pins an older numpy/pandas than the API, and a shared install would
    # silently check one against the other's versions.
    - |
      for set in backend/requirements.lock sandbox/requirements.txt sandbox-broker/requirements.txt; do
        python -m venv "/tmp/venv-$(dirname "$set")"
        "/tmp/venv-$(dirname "$set")/bin/pip" install --no-cache-dir -q $( [ "$set" = backend/requirements.lock ] && echo --require-hashes ) -r "$set"
        "/tmp/venv-$(dirname "$set")/bin/pip" install --no-cache-dir -q pip-licenses
        "/tmp/venv-$(dirname "$set")/bin/python" scripts/check-licences.py python "$set"
      done
    - cd frontend && npm ci --ignore-scripts --no-audit --no-fund > /dev/null && cd ..
    - python scripts/check-licences.py node frontend

# Fail on CRITICAL/HIGH findings in the pinned SeaweedFS image (deploy/seaweedfs/VERSION).
object-storage-image-audit:
  stage: audit
  image:
    name: aquasec/trivy:0.62.1
    entrypoint: [""]
  rules:
    - changes:
        - docker-compose.yml
        - deploy/seaweedfs/**/*
        - .gitlab-ci.yml
  script:
    - trivy image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed "$SEAWEEDFS_IMAGE"
  allow_failure: false

# Build and push Alpharouter images to the GitLab Container Registry.
# Tags: alpha-router, alpha-router-sandbox, alpha-router-sandbox-broker, alpha-router-edge
# New host: ALPHAROUTER_REGISTRY=$CI_REGISTRY_IMAGE ./scripts/install.sh --from-registry --image-tag <tag>
# Existing host with data: ./scripts/upgrade.sh --from-registry --image-tag <tag>
publish-images:
  stage: publish
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build -t "$CI_REGISTRY_IMAGE/alpha-router:$TAG" -f Dockerfile .
    - docker build -t "$CI_REGISTRY_IMAGE/alpha-router-sandbox:$TAG" -f sandbox/Dockerfile sandbox
    - docker build -t "$CI_REGISTRY_IMAGE/alpha-router-sandbox-broker:$TAG" -f sandbox-broker/Dockerfile .
    - docker build -t "$CI_REGISTRY_IMAGE/alpha-router-edge:$TAG" -f deploy/edge/Dockerfile .
    # Scan what we are about to ship: fail on fixable CRITICAL/HIGH findings
    # and keep a CycloneDX SBOM per image as a pipeline artifact. Until now only
    # the third-party SeaweedFS image was scanned.
    - mkdir -p sbom
    - |
      for name in alpha-router alpha-router-sandbox alpha-router-sandbox-broker alpha-router-edge; do
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/sbom"           -e DOCKER_HOST="$DOCKER_HOST" aquasec/trivy:0.62.1 image           --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed "$CI_REGISTRY_IMAGE/${name}:$TAG"
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/sbom"           -e DOCKER_HOST="$DOCKER_HOST" aquasec/trivy:0.62.1 image           --format cyclonedx --output "/sbom/${name}-${TAG}.cdx.json" "$CI_REGISTRY_IMAGE/${name}:$TAG"
      done
    - docker push "$CI_REGISTRY_IMAGE/alpha-router:$TAG"
    - docker push "$CI_REGISTRY_IMAGE/alpha-router-sandbox:$TAG"
    - docker push "$CI_REGISTRY_IMAGE/alpha-router-sandbox-broker:$TAG"
    - docker push "$CI_REGISTRY_IMAGE/alpha-router-edge:$TAG"
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        for name in alpha-router alpha-router-sandbox alpha-router-sandbox-broker alpha-router-edge; do
          docker tag "$CI_REGISTRY_IMAGE/${name}:$TAG" "$CI_REGISTRY_IMAGE/${name}:latest"
          docker push "$CI_REGISTRY_IMAGE/${name}:latest"
        done
      fi
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - sbom/
