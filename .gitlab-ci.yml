stages:
  - verify
  - audit
  - publish

variables:
  SEAWEEDFS_IMAGE: "chrislusf/seaweedfs:4.40"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

backend-tests:
  stage: verify
  image: python:3.12-slim
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml
  script:
    - python -m pip install --no-cache-dir -r backend/requirements.txt
    - python -m pip install --no-cache-dir pytest
    - python -m pip check
    - PYTHONPATH=backend python -m pytest backend/tests -q

deployment-config:
  stage: verify
  image: docker:27-cli
  variables:
    COMPOSE_PROJECT_NAME: "alpha-router"
    POSTGRES_USER: "alpha_router"
    POSTGRES_DB: "alpha_router"
    POSTGRES_PASSWORD: "ci-compose-placeholder"
    S3_ACCESS_KEY: "alpha_router"
    S3_SECRET_KEY: "ci-compose-placeholder"
    S3_BUCKET: "alpha-router-media"
    SEAWEEDFS_ADMIN_PASSWORD: "ci-compose-placeholder"
    SANDBOX_BROKER_TOKEN: "ci-compose-placeholder-at-least-32-characters"
  rules:
    - changes:
        - docker-compose.yml
        - Dockerfile
        - sandbox/**/*
        - sandbox-broker/**/*
        - deploy/**/*
        - scripts/**/*
        - .env.example
        - .gitlab-ci.yml
  script:
    - cp .env.example .env
    - docker compose config --quiet
    - ALPHAROUTER_REGISTRY=registry.example.com/group/alpha-router docker compose -f docker-compose.yml -f deploy/docker-compose.registry.yml config --quiet

frontend-tests-and-build:
  stage: verify
  image: node:20
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - npm test
    - npm run build

frontend-audit:
  stage: audit
  image: node:20
  rules:
    - changes:
        - frontend/package.json
        - frontend/package-lock.json
        - .gitlab-ci.yml
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - npm audit --omit=dev --audit-level=high

backend-audit:
  stage: audit
  image: python:3.12-slim
  rules:
    - changes:
        - backend/requirements.txt
        - .gitlab-ci.yml
  script:
    - python -m pip install --no-cache-dir pip-audit
    - pip-audit -r backend/requirements.txt -f json -o pip-audit.json || audit_status=$?
    - test -f pip-audit.json
    - cat pip-audit.json
    - |
      if [ "${audit_status:-0}" -ne 0 ]; then
        echo "pip-audit reported vulnerabilities; review pip-audit.json before merging."
        exit "${audit_status}"
      fi
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - pip-audit.json

# Fail on CRITICAL/HIGH findings in the pinned SeaweedFS image (deploy/seaweedfs/VERSION).
object-storage-image-audit:
  stage: audit
  image:
    name: aquasec/trivy:0.62.1
    entrypoint: [""]
  rules:
    - changes:
        - docker-compose.yml
        - deploy/seaweedfs/**/*
        - .gitlab-ci.yml
  script:
    - trivy image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed "$SEAWEEDFS_IMAGE"
  allow_failure: false

# Build and push Alpharouter images to the GitLab Container Registry.
# Tags: alpha-router, alpha-router-sandbox, alpha-router-sandbox-broker
# New host: ALPHAROUTER_REGISTRY=$CI_REGISTRY_IMAGE ./scripts/install.sh --from-registry --image-tag <tag>
# Existing host with data: ./scripts/upgrade.sh --from-registry --image-tag <tag>
publish-images:
  stage: publish
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build -t "$CI_REGISTRY_IMAGE/alpha-router:$TAG" -f Dockerfile .
    - docker build -t "$CI_REGISTRY_IMAGE/alpha-router-sandbox:$TAG" -f sandbox/Dockerfile sandbox
    - docker build -t "$CI_REGISTRY_IMAGE/alpha-router-sandbox-broker:$TAG" -f sandbox-broker/Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE/alpha-router:$TAG"
    - docker push "$CI_REGISTRY_IMAGE/alpha-router-sandbox:$TAG"
    - docker push "$CI_REGISTRY_IMAGE/alpha-router-sandbox-broker:$TAG"
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        for name in alpha-router alpha-router-sandbox alpha-router-sandbox-broker; do
          docker tag "$CI_REGISTRY_IMAGE/${name}:$TAG" "$CI_REGISTRY_IMAGE/${name}:latest"
          docker push "$CI_REGISTRY_IMAGE/${name}:latest"
        done
      fi
