# Phase 3 gate: defect rules (E/F/B/BLE), modernisation (UP), simplification
# (SIM) and a complexity ceiling. `ruff format` is also enforced in CI.
target-version = "py312"
line-length = 120
extend-exclude = ["alembic/versions"]

[lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "B",    # bugbear
  "UP",   # pyupgrade
  "SIM",  # simplify
  "C90",  # mccabe complexity
  "BLE",  # blind except
]
ignore = [
  "B008", # function call in default argument — FastAPI Depends()/Query() idiom
  "E501", # line length is the formatter's job
  "UP042", # str+Enum -> StrEnum changes str()/format() output of the members; revisit deliberately
]

[lint.mccabe]
# Functions above the ceiling carry `# noqa: C901` with a reason; the list is
# the Phase 4 refactor backlog and must not grow.
max-complexity = 20

[lint.per-file-ignores]
# Package re-exports register ORM models on Base.metadata; keep them.
"app/models/__init__.py" = ["F401"]
"app/__init__.py" = ["F401"]
"tests/**" = ["F841", "BLE001", "SIM117"]
