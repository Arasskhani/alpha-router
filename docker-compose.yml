services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alpha-router}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-alpha-router}
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
    volumes:
      - alpha_router_pg:/var/lib/postgresql/data
    networks:
      - app_net
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpha-router"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-alpha-router}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-alpha-router}
      # edoburu image defaults to 5432; set 6432 so app/host use standard PgBouncer port
      LISTEN_PORT: 6432
      # Postgres 16 uses SCRAM; default pgbouncer auth is MD5
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 4000
      DEFAULT_POOL_SIZE: 90
      MIN_POOL_SIZE: 20
      RESERVE_POOL_SIZE: 15
      SERVER_RESET_QUERY: DISCARD ALL
    ports:
      - "127.0.0.1:6432:6432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U alpha-router -d alpha-router"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net

  redis:
    image: redis:7-alpine
    # Require authentication when REDIS_PASSWORD is set; empty (default) keeps
    # legacy no-auth behavior for existing single-box deployments. When set,
    # wire REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0 in the alpha-router service.
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD:-}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - alpha_router_redis:/data
    networks:
      - app_net

  # Primary object storage (SeaweedFS weed mini). S3 API :8333, Admin UI :23646.
  # Pin version via deploy/seaweedfs/VERSION (currently 4.40).
  seaweedfs:
    image: chrislusf/seaweedfs:4.40
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      # weed mini enables S3 auth when AWS_* credentials are present (never Allow All).
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set in .env}
      S3_BUCKET: ${S3_BUCKET:-alpha-router-media}
      SEAWEEDFS_ADMIN_PASSWORD: ${SEAWEEDFS_ADMIN_PASSWORD:?SEAWEEDFS_ADMIN_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:23646:23646"
    volumes:
      - alpha_router_seaweedfs:/data
      - ./deploy/seaweedfs/entrypoint.sh:/entrypoint.sh:ro
    networks:
      - app_net
    healthcheck:
      # S3 :8333 returns 403 without credentials; master cluster status is a reliable readiness probe.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  # Code-interpreter sandbox image. Not started as a long-running service; it is
  # spawned on demand as a disposable, network-less container by the alpha-router app.
  # Build explicitly with: docker compose build sandbox
  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    image: alpha-router-sandbox:latest
    profiles: ["build-only"]
    restart: "no"

  sandbox-broker:
    build:
      context: .
      dockerfile: sandbox-broker/Dockerfile
    image: alpha-router-sandbox-broker:latest
    restart: unless-stopped
    # Runs as uid 10001. docker.sock on Docker Desktop is root:root mode 660, so
    # the supplementary root group is required for API access without process uid 0.
    # The socket remains a residual host trust boundary; never publish port 8081.
    user: "10001:10001"
    group_add:
      - "0"
    environment:
      SANDBOX_BROKER_TOKEN: ${SANDBOX_BROKER_TOKEN:?SANDBOX_BROKER_TOKEN must be set in .env}
      HOME: /tmp
      DOCKER_HOST: unix:///var/run/docker.sock
    expose:
      - "8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
    mem_limit: 256m
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - sandbox_control
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5

  alpha_router:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      # Docker network overrides (env_file supplies pool/worker/rate-limit tuning)
      CODE_SANDBOX_BROKER_URL: http://sandbox-broker:8081
      CODE_SANDBOX_BROKER_TOKEN: ${SANDBOX_BROKER_TOKEN:?SANDBOX_BROKER_TOKEN must be set in .env}
      # Object storage (SeaweedFS S3 API). Overrides .env hostnames for Compose DNS.
      S3_ENDPOINT_URL: http://seaweedfs:8333
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # ZIP download packs under /tmp; keep headroom above max ZIP download setting.
      - /tmp:rw,nosuid,nodev,size=10g
      - /home/alpha_router:rw,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=700
      - /app/app/storage:rw,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=700
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --workers
      - "${UVICORN_WORKERS:-4}"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started
      seaweedfs:
        condition: service_healthy
      sandbox-broker:
        condition: service_healthy
    networks:
      - app_net
      - sandbox_control

volumes:
  alpha_router_pg:
  alpha_router_redis:
  alpha_router_seaweedfs:

networks:
  app_net:
  sandbox_control:
    internal: true
