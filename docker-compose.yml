name: alpha-router

# Bounded container logs: without these, json-file logs grow until the disk
# is full (nginx access log + uvicorn + clamav freshclam alone can do GBs a
# week). 50 MB x 5 files per container; `docker compose logs` still works.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  postgres:
    logging: *default-logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alpha_router}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-alpha_router}
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
    volumes:
      - alpha_router_pg:/var/lib/postgresql/data
    networks:
      - alpha_router_app
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    logging: *default-logging
    image: edoburu/pgbouncer:1.22.1-p0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-alpha_router}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-alpha_router}
      # edoburu image defaults to 5432; set 6432 so app/host use standard PgBouncer port
      LISTEN_PORT: 6432
      # Postgres 16 uses SCRAM; default pgbouncer auth is MD5
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 4000
      DEFAULT_POOL_SIZE: 90
      MIN_POOL_SIZE: 20
      RESERVE_POOL_SIZE: 15
      SERVER_RESET_QUERY: DISCARD ALL
    ports:
      - "127.0.0.1:6432:6432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER:-alpha_router} -d ${POSTGRES_DB:-alpha_router}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - alpha_router_app

  redis:
    logging: *default-logging
    image: redis:7.2-alpine
    restart: unless-stopped
    # Require authentication when REDIS_PASSWORD is set; empty (default) keeps
    # legacy no-auth behavior for existing single-box deployments. When set,
    # wire REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0 in the Alpharouter service.
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD:-}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - alpha_router_redis:/data
    networks:
      - alpha_router_app
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  clamav:
    logging: *default-logging
    image: clamav/clamav:1.5.4-debian13-slim
    restart: unless-stopped
    volumes:
      - alpha_router_clamav:/var/lib/clamav
    networks:
      - alpha_router_app

  qdrant:
    logging: *default-logging
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY must be set in .env}
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - alpha_router_qdrant:/qdrant/storage
    networks:
      - alpha_router_app
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Primary object storage (SeaweedFS weed mini). S3 API :8333, Admin UI :23646.
  # Pin version via deploy/seaweedfs/VERSION (currently 4.40).
  seaweedfs:
    logging: *default-logging
    image: chrislusf/seaweedfs:4.40
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      # weed mini enables S3 auth when AWS_* credentials are present (never Allow All).
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set in .env}
      S3_BUCKET: ${S3_BUCKET:-alpha-router-media}
      SEAWEEDFS_ADMIN_PASSWORD: ${SEAWEEDFS_ADMIN_PASSWORD:?SEAWEEDFS_ADMIN_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:23646:23646"
    volumes:
      - alpha_router_seaweedfs:/data
      - ./deploy/seaweedfs/entrypoint.sh:/entrypoint.sh:ro
    networks:
      - alpha_router_app
    healthcheck:
      # S3 :8333 returns 403 without credentials; master cluster status is a reliable readiness probe.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  # Code-interpreter sandbox image. Not started as a long-running service; it is
  # spawned on demand as a disposable, network-less container by Alpharouter.
  # Build explicitly with: docker compose build alpha-router-sandbox
  alpha-router-sandbox:
    logging: *default-logging
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    image: alpha-router-sandbox:latest
    entrypoint: ["/bin/true"]
    restart: "no"
    network_mode: "none"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  alpha-router-sandbox-broker:
    logging: *default-logging
    build:
      context: .
      dockerfile: sandbox-broker/Dockerfile
    image: alpha-router-sandbox-broker:latest
    restart: unless-stopped
    depends_on:
      alpha-router-sandbox:
        condition: service_completed_successfully
    # Runs as uid 10001. On many Docker hosts docker.sock is root:root mode 660,
    # so the supplementary root group is required for API access without process
    # uid 0. The socket remains a residual host trust boundary; never publish
    # port 8081.
    user: "10001:10001"
    group_add:
      - "0"
    environment:
      SANDBOX_BROKER_TOKEN: ${SANDBOX_BROKER_TOKEN:?SANDBOX_BROKER_TOKEN must be set in .env}
      SANDBOX_MAX_CONCURRENT: ${SANDBOX_MAX_CONCURRENT:-200}
      SANDBOX_QUEUE_TIMEOUT_SECONDS: ${SANDBOX_QUEUE_TIMEOUT_SECONDS:-0.1}
      SANDBOX_RETRY_AFTER_SECONDS: ${SANDBOX_RETRY_AFTER_SECONDS:-30}
      SANDBOX_HARD_MAX_WORKSPACE_FILES: ${SANDBOX_HARD_MAX_WORKSPACE_FILES:-1000}
      SANDBOX_HARD_MAX_WORKSPACE_FILE_BYTES: ${SANDBOX_HARD_MAX_WORKSPACE_FILE_BYTES:-67108864}
      SANDBOX_HARD_MAX_WORKSPACE_TOTAL_BYTES: ${SANDBOX_HARD_MAX_WORKSPACE_TOTAL_BYTES:-67108864}
      SANDBOX_HARD_MAX_REQUEST_BYTES: ${SANDBOX_HARD_MAX_REQUEST_BYTES:-75497472}
      SANDBOX_JOB_RETENTION_SECONDS: ${SANDBOX_JOB_RETENTION_SECONDS:-300}
      SANDBOX_MAX_TRACKED_JOBS: ${SANDBOX_MAX_TRACKED_JOBS:-10000}
      HOME: /home/alpha_router
      DOCKER_HOST: unix:///var/run/docker.sock
    expose:
      - "8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
      - /home/alpha_router:rw,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=700
    # 200 concurrent docker CLI children cannot run under the previous 128 PID /
    # 256 MiB broker limits. Final values remain subject to the documented load gate.
    mem_limit: 2g
    pids_limit: 512
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - alpha_router_sandbox_control
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 45s

  # One-shot schema bootstrap + Alembic upgrade. App/workers wait on success.
  db-init:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
      # Stamped from the git tag by install.sh / upgrade.sh. Both services that
      # build alpha-router:latest pass the same values, so whichever one builds
      # cannot leave the image labelled with a different version.
      args:
        APP_VERSION: ${ALPHAROUTER_VERSION:-}
        APP_REVISION: ${ALPHAROUTER_REVISION:-}
    image: alpha-router:latest
    env_file:
      - .env
    command: ["python", "-m", "app.migrate"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
      - /home/alpha_router:rw,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      pgbouncer:
        condition: service_healthy
    networks:
      - alpha_router_app

  alpha-router-knowledge-scheduler:
    logging: *default-logging
    image: alpha-router:latest
    env_file:
      - .env
    command: ["python", "-m", "app.knowledge_scheduler"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
      - /home/alpha_router:rw,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - alpha_router_app

  alpha-router-knowledge-worker:
    logging: *default-logging
    image: alpha-router:latest
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY must be set in .env}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      KNOWLEDGE_PARSER_MEMORY_BYTES: ${KNOWLEDGE_PARSER_MEMORY_BYTES:-1610612736}
    command: ["python", "-m", "app.knowledge_worker"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=768m
      - /home/alpha_router:rw,nosuid,nodev,size=32m,uid=10001,gid=10001,mode=700
    mem_limit: 3g
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      clamav:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    networks:
      - alpha_router_app

  alpha-router:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${ALPHAROUTER_VERSION:-}
        APP_REVISION: ${ALPHAROUTER_REVISION:-}
    image: alpha-router:latest
    restart: unless-stopped
    # Chat completions stream for minutes. Give in-flight turns time to finish
    # and settle (see --timeout-graceful-shutdown below) before SIGKILL.
    stop_grace_period: 120s
    healthcheck:
      # /ready: 200 only when database and redis answer (qdrant/object storage
      # are reported as degraded, never fatal). /health stays a constant.
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 90s
    env_file:
      - .env
    ports:
      - "${ALPHAROUTER_HTTP_BIND:-0.0.0.0}:8080:8080"
    environment:
      # Docker network overrides (env_file supplies pool/worker/rate-limit tuning)
      CODE_SANDBOX_BROKER_URL: http://alpha-router-sandbox-broker:8081
      CODE_SANDBOX_BROKER_TOKEN: ${SANDBOX_BROKER_TOKEN:?SANDBOX_BROKER_TOKEN must be set in .env}
      # Object storage (SeaweedFS S3 API). Overrides .env hostnames for Compose DNS.
      S3_ENDPOINT_URL: http://seaweedfs:8333
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY must be set in .env}
      # Shared tmpfs-backed Prometheus files aggregate all Uvicorn workers.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      # Never set these to true here. Keep false in .env unless you have a written
      # lab-only exception (see .env.example "DANGEROUS OPT-IN FLAGS"):
      #   ALLOW_LEGACY_BEARER_AUTH, ALLOW_SSRF_PRIVATE_RANGES,
      #   ALLOW_INSECURE_CODE_SUBPROCESS

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - alpha_router_tls:/app/tls
    tmpfs:
      # ZIP download packs are assembled under /tmp. tmpfs is RAM: size it for
      # MAX_ZIP_AGGREGATE_BYTES (256 MiB default) x UVICORN_WORKERS with headroom,
      # not for the whole host. Raise it together with those settings.
      - /tmp:rw,nosuid,nodev,size=2g
      - /home/alpha_router:rw,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=700
      - /app/app/storage:rw,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=700
    command:
      - /bin/sh
      - -c
      - >-
        rm -rf /tmp/prometheus &&
        mkdir -p /tmp/prometheus &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8080
        --workers ${UVICORN_WORKERS:-4}
        --timeout-graceful-shutdown 110
        --proxy-headers
        --forwarded-allow-ips=${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
    depends_on:
      db-init:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      alpha-router-sandbox-broker:
        condition: service_healthy
    networks:
      - alpha_router_app
      - alpha_router_sandbox_control

  alpha-router-edge:
    logging: *default-logging
    build:
      context: .
      dockerfile: deploy/edge/Dockerfile
    image: alpha-router-edge:latest
    network_mode: host
    restart: unless-stopped
    volumes:
      - alpha_router_tls:/etc/alpha-router/tls
    cap_drop:
      - ALL
    cap_add:
      # Bind 443 (or any privileged HTTPS port) chosen in Security Settings.
      - NET_BIND_SERVICE
      # nginx master starts as root and drops workers to the nginx user.
      - SETUID
      - SETGID
      # nginx -t / startup chowns /var/cache/nginx/*_temp to uid 101 (nginx).
      # Without CHOWN, that syscall fails on the read-only + tmpfs rootfs.
      - CHOWN
      # Read key.pem, which the app writes as uid 10001 with mode 0600.
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,nosuid,nodev
      - /var/log/nginx:rw,nosuid,nodev,size=64m
      - /run:rw,nosuid,nodev
      - /tmp:rw,nosuid,nodev
    healthcheck:
      test: ["CMD-SHELL", "/entrypoint.sh --healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      # The edge only proxies; start it once the app answers /ready so a
      # fresh deploy does not serve 502s while workers boot.
      alpha-router:
        condition: service_healthy

volumes:
  alpha_router_pg:
    name: alpha_router_pg
  alpha_router_redis:
    name: alpha_router_redis
  alpha_router_qdrant:
    name: alpha_router_qdrant
  alpha_router_seaweedfs:
    name: alpha_router_seaweedfs
  alpha_router_clamav:
    name: alpha_router_clamav
  alpha_router_tls:
    name: alpha_router_tls

networks:
  alpha_router_app:
    name: alpha_router_app
  alpha_router_sandbox_control:
    name: alpha_router_sandbox_control
    internal: true
