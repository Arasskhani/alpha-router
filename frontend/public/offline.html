<!DOCTYPE html>
<!--
  Alpharouter's page for when the server cannot be reached. The service worker
  (sw.js) caches this one file and shows it instead of the browser's error page
  or a proxy's 502/503/504. Self-contained, and no script: an enforced
  script-src 'self' would block inline JavaScript. After editing, update
  OFFLINE_REV in sw.js; a unit test says the new value.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Alpharouter can't be reached</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --surface: #ffffff;
        --text: #12171e;
        --muted: #5b6573;
        --border: #e3e6ea;
        --accent: #0f766e;
        --accent-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0f14;
          --surface: #12171e;
          --text: #e8ebef;
          --muted: #a3acb8;
          --border: #273040;
          --accent: #2dd4bf;
          --accent-text: #0b0f14;
        }
        .mark {
          filter: invert(1);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));
        background: var(--bg);
        color: var(--text);
        font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 26rem;
        padding: 2rem 1.5rem;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
        text-align: center;
      }
      .mark {
        width: 56px;
        height: auto;
        margin-bottom: 1rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
        line-height: 1.3;
      }
      p {
        margin: 0 0 0.75rem;
        color: var(--muted);
      }
      .retry {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        margin-top: 0.75rem;
        padding: 0 1.5rem;
        border-radius: 10px;
        background: var(--accent);
        color: var(--accent-text);
        font-weight: 600;
        text-decoration: none;
      }
      .retry:focus-visible {
        outline: 3px solid var(--text);
        outline-offset: 2px;
      }
    </style>
  </head>
